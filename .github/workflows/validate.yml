name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Python syntax without bytecode artifacts
        run: python skill/mcp-server-engineering/scripts/check_python_syntax.py skill/mcp-server-engineering/scripts tools tests

      - name: Run validation-script tests
        run: python -m unittest discover -v

      - name: Validate version register and bilingual peers
        run: |
          python skill/mcp-server-engineering/scripts/validate_version_register.py VERSION-REGISTER.json
          python skill/mcp-server-engineering/scripts/sync_profile_mirrors.py --check VERSION-REGISTER.json
          python skill/mcp-server-engineering/scripts/check_bilingual_coverage.py .

      - name: Validate evaluation corpus and public evidence receipts
        run: python tools/validate_evaluation_corpus.py .

      - name: Validate skill package and local links
        run: |
          python skill/mcp-server-engineering/scripts/validate_skill_package.py skill/mcp-server-engineering
          python skill/mcp-server-engineering/scripts/check_markdown_links.py .

      - name: Scan public repository text boundary
        run: python skill/mcp-server-engineering/scripts/scan_review_bundle.py .
